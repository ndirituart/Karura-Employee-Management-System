<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Employee — Karura MIS</title>
  <link rel="stylesheet" href="employee.css">
</head>
<body>

  <main class="page">
    <header class="page-header">
      <h1>Create Employee</h1>
      <p class="subtitle">
        The user must already exist in the system. Enter the User ID and
        assign a role before saving the employee record.
      </p>
    </header>

    <form id="employeeForm" class="employee-form" novalidate>
     <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="errorMessage"   class="alert alert-error">{{ errorMessage }}</div>

      <!-- ============ Section 1: Link to existing user ============ -->
      <section class="form-section">
        <h2 class="section-title">Account Link</h2>

        <div class="grid grid-2">
          <div class="field">
            <label for="userId">User ID <span class="required">*</span></label>
            <div class="input-with-status">
              <input
                id="userId"
                name="userId"
                type="number"
                min="1"
                placeholder="e.g. 1024"
                required
                autocomplete="off">
              <span id="userCheckIcon" class="status-icon" aria-hidden="true"></span>
            </div>
            <small id="userIdHelp" class="help">
              Must match an existing user account.
            </small>
            <span id="userIdError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="role">Role <span class="required">*</span></label>
            <select id="role" name="role" required>
              <option value="" disabled selected>— Select a role —</option>
              <option value="Admin">Admin</option>
              <option value="Manager">Manager</option>
              <option value="Supervisor">Supervisor</option>
              <option value="Employee">Employee</option>
              <option value="Intern">Intern</option>
            </select>
            <span id="roleError" class="field-error" role="alert"></span>
          </div>
        </div>
      </section>

      <!-- ============ Section 2: Personal details ============ -->
      <section class="form-section">
        <h2 class="section-title">Personal Details</h2>

        <div class="grid grid-2">
          <div class="field">
            <label for="firstName">First Name <span class="required">*</span></label>
            <input id="firstName" name="firstName" type="text" required maxlength="80">
            <span id="firstNameError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="lastName">Last Name <span class="required">*</span></label>
            <input id="lastName" name="lastName" type="text" required maxlength="80">
            <span id="lastNameError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="email">Email <span class="required">*</span></label>
            <input id="email" name="email" type="email" required maxlength="150">
            <span id="emailError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="phoneNumber">Phone Number</label>
            <input id="phoneNumber" name="phoneNumber" type="tel"
                   placeholder="+254 7XX XXX XXX" maxlength="20">
            <span id="phoneNumberError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="dateOfBirth">Date of Birth</label>
            <input id="dateOfBirth" name="dateOfBirth" type="date">
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender">
              <option value="">— Select —</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
              <option value="Prefer not to say">Prefer not to say</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ============ Section 3: Employment details ============ -->
      <section class="form-section">
        <h2 class="section-title">Employment Details</h2>

        <div class="grid grid-2">
          <div class="field">
            <label for="department">Department <span class="required">*</span></label>
            <select id="department" name="department" required>
              <option value="" disabled selected>— Select department —</option>
              <option value="Forestry">Forestry</option>
              <option value="Conservation">Conservation</option>
              <option value="Finance">Finance</option>
              <option value="Human Resources">Human Resources</option>
              <option value="ICT">ICT</option>
              <option value="Operations">Operations</option>
            </select>
            <span id="departmentError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="jobTitle">Job Title <span class="required">*</span></label>
            <input id="jobTitle" name="jobTitle" type="text" required maxlength="120">
            <span id="jobTitleError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="hireDate">Hire Date <span class="required">*</span></label>
            <input id="hireDate" name="hireDate" type="date" required>
            <span id="hireDateError" class="field-error" role="alert"></span>
          </div>

          <div class="field">
            <label for="employmentType">Employment Type</label>
            <select id="employmentType" name="employmentType">
              <option value="">— Select —</option>
              <option value="Permanent">Permanent</option>
              <option value="Contract">Contract</option>
              <option value="Casual">Casual</option>
              <option value="Internship">Internship</option>
            </select>
          </div>

          <div class="field">
            <label for="salary">Monthly Salary (KES)</label>
            <input id="salary" name="salary" type="number" min="0" step="0.01"
                   placeholder="e.g. 85000">
          </div>

          <div class="field">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="Active" selected>Active</option>
              <option value="On Leave">On Leave</option>
              <option value="Suspended">Suspended</option>
              <option value="Terminated">Terminated</option>
            </select>
          </div>
        </div>
      </section>

      <!-- ============ Section 4: Address ============ -->
      <section class="form-section">
        <h2 class="section-title">Address</h2>

        <div class="grid grid-2">
          <div class="field">
            <label for="county">County</label>
            <input id="county" name="county" type="text" maxlength="60">
          </div>
          <div class="field">
            <label for="town">Town / City</label>
            <input id="town" name="town" type="text" maxlength="60">
          </div>
          <div class="field field-wide">
            <label for="postalAddress">Postal Address</label>
            <input id="postalAddress" name="postalAddress" type="text" maxlength="120"
                   placeholder="P.O. Box ...">
          </div>
        </div>
      </section>

      <!-- ============ Actions ============ -->
      <div class="form-actions">
        <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
        <button type="submit" id="submitBtn" class="btn btn-primary">
          <span class="btn-label">Create Employee</span>
          <span class="btn-spinner" hidden></span>
        </button>
      </div>

      <div id="formMessage" class="form-message" role="status" hidden></div>
    </form>
  </main>

  <script src="employee.js"></script>
</body>
</html>
